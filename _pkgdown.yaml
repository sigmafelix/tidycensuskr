url: https://sigmafelix.github.io/tidycensuskr/


template:
  bootstrap: 5
  bootswatch: simplex
  params:
    mathjax: true

articles:
- title: Vignettes
  navbar: ~
  contents:
  - v01_intro
  - v02_regional_analysis
  - v03_gallery
  - v04_data_cleaning_kosis
